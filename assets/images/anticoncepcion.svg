<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ilustración de objetos históricos de anticoncepción: un frasco con pesario, una esponja y un preservativo antiguo, junto a una línea de tiempo.">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B2B"/><stop offset="1" stop-color="#0A0D18"/>
    </linearGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB454"/><stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cbg)"/>

  <!-- frasco con pesario -->
  <g>
    <rect x="110" y="200" width="150" height="210" rx="26" fill="#151D31" stroke="#36D9F5" stroke-opacity=".65" stroke-width="3"/>
    <rect x="140" y="164" width="90" height="46" rx="10" fill="#1B2440" stroke="#36D9F5" stroke-opacity=".65" stroke-width="3"/>
    <path d="M126 320c40-30 78 22 118-10v74a26 26 0 0 1-26 26H152a26 26 0 0 1-26-26z" fill="#FFB454" fill-opacity=".3"/>
    <ellipse cx="185" cy="272" rx="46" ry="26" fill="none" stroke="#9B5CFF" stroke-width="6"/>
    <ellipse cx="185" cy="272" rx="20" ry="11" fill="none" stroke="#9B5CFF" stroke-width="4"/>
    <g stroke="#A7B0C4" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
      <path d="M134 440h104M134 462h64"/>
    </g>
  </g>

  <!-- esponja marina -->
  <g>
    <circle cx="420" cy="300" r="86" fill="#221A2E" stroke="#FFB454" stroke-opacity=".8" stroke-width="4"/>
    <g fill="none" stroke="#FFB454" stroke-opacity=".65" stroke-width="3">
      <circle cx="398" cy="278" r="14"/><circle cx="444" cy="300" r="18"/>
      <circle cx="410" cy="330" r="12"/><circle cx="450" cy="262" r="10"/>
      <circle cx="382" cy="316" r="9"/>
    </g>
    <path d="M420 214v-52" stroke="#FFB454" stroke-width="5" stroke-linecap="round"/>
    <path d="M400 176l20-26 20 26" fill="none" stroke="#FFB454" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- preservativo histórico (envoltorio) -->
  <g>
    <rect x="570" y="230" width="150" height="150" rx="16" fill="#151D31" stroke="#9B5CFF" stroke-opacity=".75" stroke-width="3"/>
    <path d="M570 266h150M604 230v150M686 230v150" stroke="#9B5CFF" stroke-opacity=".5" stroke-width="2.5"/>
    <path d="M626 300c0-16 14-28 26-28s26 12 26 28-12 46-26 62c-14-16-26-46-26-62z" fill="url(#cg)"/>
    <path d="M640 268h24" stroke="#0A0D18" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- línea de tiempo -->
  <g stroke="#A7B0C4" stroke-opacity=".45" stroke-width="3">
    <path d="M80 100h640"/>
  </g>
  <g fill="#36D9F5">
    <circle cx="140" cy="100" r="8"/><circle cx="330" cy="100" r="8"/>
    <circle cx="520" cy="100" r="8"/><circle cx="680" cy="100" r="10"/>
  </g>
  <g font-family="monospace" font-size="17" fill="#A7B0C4">
    <text x="112" y="76">s. IV a.C.</text>
    <text x="300" y="76">s. XVI</text>
    <text x="492" y="76">1844</text>
    <text x="650" y="76">1960</text>
  </g>

  <path d="M40 470h720" stroke="#A7B0C4" stroke-opacity=".3" stroke-width="3"/>
</svg>
