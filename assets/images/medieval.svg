<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ilustración de un manuscrito medieval, un frasco de boticario y un bordón.">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161426"/><stop offset="1" stop-color="#0A0D18"/>
    </linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A7FF"/><stop offset="1" stop-color="#36D9F5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mbg)"/>

  <!-- arco gótico -->
  <path d="M120 470V240c0-90 70-160 160-160s160 70 160 160v230" fill="none" stroke="#C9A7FF" stroke-opacity=".22" stroke-width="3"/>

  <!-- manuscrito abierto -->
  <g>
    <path d="M110 300h260v140H110z" fill="#211B2E" stroke="#C9A7FF" stroke-opacity=".55" stroke-width="2.5"/>
    <path d="M240 300v140" stroke="#C9A7FF" stroke-opacity=".45" stroke-width="3"/>
    <g stroke="#A7B0C4" stroke-opacity=".75" stroke-width="3" stroke-linecap="round">
      <path d="M126 326h100M126 348h100M126 370h76M126 392h100M126 414h64"/>
      <path d="M258 326h100M258 348h76M258 370h100M258 392h84M258 414h100"/>
    </g>
    <path d="M136 300v-34l24 14 24-14v34" fill="url(#mg)" opacity=".9"/>
    <path d="M286 300v-34l24 14 24-14v34" fill="url(#mg)" opacity=".9"/>
  </g>

  <!-- frasco de boticario -->
  <g>
    <rect x="470" y="250" width="120" height="170" rx="20" fill="#151C31" stroke="#36D9F5" stroke-opacity=".7" stroke-width="3"/>
    <rect x="492" y="212" width="76" height="44" rx="8" fill="#1B2440" stroke="#36D9F5" stroke-opacity=".7" stroke-width="3"/>
    <rect x="486" y="196" width="88" height="22" rx="8" fill="url(#mg)"/>
    <path d="M492 350c30-24 60 16 96-8v50a20 20 0 0 1-20 20h-56a20 20 0 0 1-20-20z" fill="#9B5CFF" fill-opacity=".45"/>
    <g stroke="#36D9F5" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
      <path d="M500 300h60M500 324h40"/>
    </g>
  </g>

  <!-- bordón / cayado -->
  <g stroke="url(#mg)" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M690 470V220c0-46 34-74 66-74s56 26 56 60"/>
  </g>
  <g stroke="#C9A7FF" stroke-opacity=".6" stroke-width="3" fill="none">
    <path d="M664 300h52M664 350h52"/>
  </g>

  <!-- estrella / símbolo -->
  <g stroke="#36D9F5" stroke-width="3" fill="none" opacity=".85">
    <path d="M600 110v40M580 130h40M586 116l28 28M614 116l-28 28"/>
  </g>

  <path d="M40 470h720" stroke="#A7B0C4" stroke-opacity=".3" stroke-width="3"/>
</svg>
